          plugin_unique_identifier: 'shineos/line-message-sender:0.2.0@9c092a784ae4882ea0f952f98cd818cfb638950ccc368357c6380932d0d4ddb8'
          is_team_authorization: true
          tool_name: get_bot_info
          tool_label: Get Bot Info
          tool_description: Fetch the LINE Official Account information.
          tool_parameters: { }
          tool_configurations: { }
          tool_node_version: '2'
          paramSchemas: [ ]
          output_schema: null
